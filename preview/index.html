<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking StudyRoom · Demo</title><style>:root{--bg:#f3f5f2;--paper:#fff;--ink:#24302a;--muted:#6c7972;--line:#d6ddd8;--green:#eaf6e7;--green2:#d9edd4;--yellow:#fff1a8;--blue:#1597c6;--orange:#de7b36;--red:#f8e2df;--shadow:0 12px 30px rgba(36,48,42,.12)}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:10px;background:#274f40;color:#fff;display:grid;place-items:center;font-weight:800}.brand small,.wk small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.search{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.search input{border:0;padding:8px 10px;outline:0;width:160px}.search button,.ghost,.primary,.danger,.icon,.today{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;cursor:pointer}.primary{background:#274f40;color:#fff;border-color:#274f40}.danger{color:#9e413b;border-color:#d8aaa7}.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.wk{display:flex;align-items:center;gap:7px}.days{display:flex;justify-content:center;gap:4px}.day{border:0;border-radius:8px;background:transparent;padding:7px 12px;cursor:pointer;color:var(--muted)}.day b{display:block;color:var(--ink)}.day.active{background:#274f40;color:#fff}.day.active b{color:#fff}.legend{display:flex;gap:10px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.sheet{margin:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.datebar{height:44px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;text-transform:capitalize}.datebar span{position:absolute;right:14px;font-size:12px}.scroll{overflow:auto;max-height:calc(100vh - 170px)}.grid{display:grid;grid-template-columns:80px repeat(var(--rooms),150px) 120px;min-width:max-content}.timecol{position:sticky;left:0;z-index:8;background:#fff}.head{height:54px;background:#fff7bd;border-right:1px solid #9ea8a2;border-bottom:1px solid #8e9992;display:flex;flex-direction:column;justify-content:center;padding:8px;position:sticky;top:0;z-index:6}.timecol .head{z-index:9}.roomhead b{font-size:14px}.roomhead span{font-size:10px;color:#4b715c}.body{position:relative;height:1152px}.ts{height:48px;background:#fff7bd;border-right:1px solid #9ea8a2;border-bottom:1px solid #b7c0ba;padding:8px;font-size:12px;font-weight:700}.ts.half{color:transparent;border-bottom-color:#e2e6e3}.slot{display:block;width:100%;height:48px;border:0;border-right:1px solid #ced6d1;border-bottom:1px solid #d8dfda;background:var(--green);cursor:pointer}.slot.half{border-bottom-style:dashed}.slot:hover{background:var(--green2)}.booking{position:absolute;left:4px;right:4px;border:1px solid #d9c54a;border-radius:5px;background:var(--yellow);padding:6px;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.07)}.booking.active{background:var(--blue);color:#fff;border-color:#0d7fa8}.booking.incident{background:var(--red);border-color:#d58c84}.booking.delivered{background:#e8ece9;border-color:#c8d0ca;color:#6b756f}.booking b,.booking small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.booking small{font-size:10px;margin-top:2px}.meta{font-size:10px;font-weight:700;margin-top:4px;display:flex;justify-content:space-between}.addcol{background:#fafbfa}.add{margin:17px 10px;width:98px;border:1px dashed #9aa7a0;border-radius:10px;background:#fff;padding:14px 6px;cursor:pointer;color:#456154}.add b{display:block;font-size:20px}.overlay,.back{position:fixed;inset:0;background:rgba(28,37,32,.38);z-index:50}.hidden{display:none!important}.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 28px));background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow)}.modal header,.drawer header{display:flex;justify-content:space-between;border-bottom:1px solid #e8ece9;padding-bottom:12px}.modal h2,.drawer h2{margin:4px 0}.x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.form label{font-weight:600}.form input,.form select,.drawer input,.drawer textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;padding:10px}.check{display:flex;gap:8px;background:#f7f9f7;padding:11px;border-radius:9px}.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.drawer{position:fixed;z-index:52;right:0;top:0;height:100vh;width:min(420px,100vw);background:#fff;padding:20px;overflow:auto;box-shadow:-10px 0 28px rgba(0,0,0,.13)}.details{display:grid;gap:8px;margin:16px 0}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfa}.warn{background:#fff3da;border-color:#e6cb94}.drawer .buttons{display:grid;gap:8px}.historyitem{border-bottom:1px solid #e4e8e5;padding:10px 0}.historyitem b{display:block}.historyitem small{color:var(--muted)}@media(max-width:900px){.bar{grid-template-columns:1fr}.days{justify-content:flex-start;overflow:auto}.legend{display:none}.form{grid-template-columns:1fr}.search input{width:120px}}</style></head><body><header class="top"><div class="brand"><div class="logo">B</div><div><small>BIBLIOTECA</small><strong>Salas de estudio</strong></div></div><div class="actions"><div class="search"><input id="q" placeholder="Buscar RUT"><button id="find">Buscar</button></div><button class="ghost" id="hist">Historial</button></div></header><section class="bar"><div class="wk"><button class="icon" id="prev">‹</button><div><small>SEMANA</small><strong id="week"></strong></div><button class="icon" id="next">›</button><button class="today" id="today">Hoy</button></div><div class="days" id="days"></div><div class="legend"><span><i style="background:#eaf6e7"></i>Libre</span><span><i style="background:#fff1a8"></i>Reservada</span><span><i style="background:#1597c6"></i>En uso</span><span><i style="background:#f8e2df"></i>Incidencia</span></div></section><main class="sheet"><div class="datebar"><strong id="title"></strong><span id="sum"></span></div><div class="scroll"><div class="grid" id="grid"></div></div></main><div class="overlay hidden" id="ov"><section class="modal"><header><div><small>NUEVA / EDITAR RESERVA</small><h2 id="mt"></h2></div><button class="x" id="cx">×</button></header><div class="form"><label>RUT<input id="rut" placeholder="12.345.678-5"></label><label>Nombre<input id="name" placeholder="Nombre de la persona"></label><label>Inicio<input id="st" type="time" step="1800"></label><label>Término<input id="en" type="time" step="1800"></label></div><label class="check"><input id="mark" type="checkbox"><span><b>Entrega plumón con borrador</b><br><small>Quedará registrado junto a la reserva.</small></span></label><div class="card warn hidden" id="warn"></div><footer><button class="ghost" id="cancelm">Cancelar</button><button class="primary" id="save">Guardar reserva</button></footer></section></div><div class="back hidden" id="back"></div><aside class="drawer hidden" id="drawer"><header><div><small id="dr"></small><h2 id="dn"></h2><p id="du"></p></div><button class="x" id="cd">×</button></header><div id="detail"></div><div class="buttons" id="btns"><button class="primary" id="deliver">Entregar sala</button><button class="ghost" id="edit">Editar reserva</button><button class="danger" id="del">Cancelar reserva</button></div></aside><aside class="drawer hidden" id="history"><header><div><small>HISTORIAL POR RUT</small><h2>Historial</h2></div><button class="x" id="ch">×</button></header><input id="hq" placeholder="RUT"><button class="primary" id="hs" style="margin-top:8px">Buscar</button><div id="hc"></div></aside><script>const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};let date=new Date();date.setHours(0,0,0,0);let rooms=+localStorage.getItem('bsr_rooms')||15;let bookings=JSON.parse(localStorage.getItem('bsr_demo')||'[]');let editId=null,openId=null;function persist(){localStorage.setItem('bsr_rooms',rooms);localStorage.setItem('bsr_demo',JSON.stringify(bookings))}function weekStart(){let d=new Date(date),off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return d}function renderTop(){let s=weekStart(),e=new Date(s);e.setDate(s.getDate()+5);$('#week').textContent=pad(s.getDate())+'–'+pad(e.getDate())+' '+e.toLocaleDateString('es-CL',{month:'short'});$('#days').innerHTML='';for(let i=0;i<6;i++){let d=new Date(s);d.setDate(s.getDate()+i);let b=document.createElement('button');b.className='day'+(ymd(d)==ymd(date)?' active':'');b.innerHTML=d.toLocaleDateString('es-CL',{weekday:'short'}).toUpperCase()+'<b>'+d.getDate()+'</b>';b.onclick=()=>{date=d;render()};$('#days').appendChild(b)}$('#title').textContent=date.toLocaleDateString('es-CL',{weekday:'long',day:'2-digit',month:'long'});let day=bookings.filter(b=>b.date==ymd(date));$('#sum').textContent=rooms+' salas · '+day.length+' reservas'}function tl(i){let m=8*60+i*30;return pad(Math.floor(m/60))+':'+pad(m%60)}function active(b){let n=new Date();return !b.delivered&&b.date==ymd(n)&&mins(b.start)<=n.getHours()*60+n.getMinutes()&&mins(b.end)>n.getHours()*60+n.getMinutes()}function renderGrid(){let g=$('#grid');g.style.setProperty('--rooms',rooms);g.innerHTML='<div class="timecol"><div class="head">Horario</div><div class="body">'+Array.from({length:24},(_,i)=>'<div class="ts '+(i%2?'half':'')+'">'+(i%2?'':tl(i))+'</div>').join('')+'</div></div>';for(let r=1;r<=rooms;r++){let c=document.createElement('div'),day=bookings.filter(b=>b.date==ymd(date)&&b.room==r),busy=day.some(active);c.innerHTML='<div class="head roomhead"><b>Sala '+r+'</b><span>'+(busy?'En uso':'Disponible')+'</span></div><div class="body">'+Array.from({length:24},(_,i)=>'<button class="slot '+(i%2?'half':'')+'" data-r="'+r+'" data-t="'+tl(i)+'"></button>').join('')+'</div>';g.appendChild(c);let body=c.querySelector('.body');day.forEach(b=>{let el=document.createElement('button');el.className='booking '+(b.incident&&b.delivered?'incident':b.delivered?'delivered':active(b)?'active':'');el.style.top=((mins(b.start)-480)/30*48+2)+'px';el.style.height=Math.max(44,(mins(b.end)-mins(b.start))/30*48-4)+'px';el.innerHTML='<b>'+b.name+'</b><small>'+b.rut+'</small><div class="meta"><span>'+b.start+'–'+b.end+'</span><span>'+(b.marker?'✎':'')+(b.incident?' !':'')+'</span></div>';el.onclick=e=>{e.stopPropagation();openDrawer(b.id)};body.appendChild(el)})}let a=document.createElement('div');a.className='addcol';a.innerHTML='<div class="head"></div><button class="add"><b>＋</b>Agregar sala</button>';a.querySelector('button').onclick=()=>{rooms++;persist();render()};g.appendChild(a);document.querySelectorAll('.slot').forEach(x=>x.onclick=()=>openForm(+x.dataset.r,x.dataset.t))}function render(){renderTop();renderGrid()}function openForm(room,start,b){editId=b?.id||null;$('#ov').dataset.room=room;$('#mt').textContent='Sala '+room+' · '+start;$('#rut').value=b?.rut||'';$('#name').value=b?.name||'';$('#st').value=b?.start||start;$('#en').value=b?.end||plus(start,60);$('#mark').checked=b?.marker||false;$('#warn').classList.add('hidden');$('#ov').classList.remove('hidden')}function plus(t,m){let x=mins(t)+m;return pad(Math.floor(x/60))+':'+pad(x%60)}function closeForm(){$('#ov').classList.add('hidden')}function save(){let room=+$('#ov').dataset.room,data={date:ymd(date),room,start:$('#st').value,end:$('#en').value,name:$('#name').value.trim(),rut:$('#rut').value.trim(),marker:$('#mark').checked};if(!data.name||!data.rut||!data.start||!data.end||mins(data.end)<=mins(data.start))return alert('Completa nombre, RUT y horario válido.');if(bookings.some(b=>b.date==data.date&&b.room==room&&b.id!=editId&&mins(data.start)<mins(b.end)&&mins(data.end)>mins(b.start)))return alert('Ese horario ya está ocupado.');if(editId)Object.assign(bookings.find(b=>b.id==editId),data);else bookings.push({id:crypto.randomUUID(),...data,delivered:false,incident:false,comment:''});persist();closeForm();render()}function historyFor(rut){let k=rut.replace(/[^0-9kK]/g,'').toLowerCase();return bookings.filter(b=>b.rut.replace(/[^0-9kK]/g,'').toLowerCase()==k)}function checkRut(){let h=historyFor($('#rut').value),inc=h.filter(x=>x.incident).length;if(h.length){$('#warn').textContent=(inc>=2?'⚠ Usuario reincidente: ':'Usuario conocido: ')+h.length+' usos · '+inc+' incidencias';$('#warn').classList.remove('hidden');if(!$('#name').value)$('#name').value=h[h.length-1].name}}function openDrawer(id){openId=id;let b=bookings.find(x=>x.id==id),h=historyFor(b.rut),inc=h.filter(x=>x.incident).length;$('#dr').textContent='SALA '+b.room;$('#dn').textContent=b.name;$('#du').textContent=b.rut;$('#detail').innerHTML='<div class="card"><b>'+b.start+' → '+b.end+'</b><p>Plumón + borrador: '+(b.marker?'Sí':'No')+'</p><p>Estado: '+(b.delivered?'Entregada':active(b)?'En uso':'Reservada')+'</p></div><div class="card '+(inc>=2?'warn':'')+'"><b>'+h.length+' usos · '+inc+' incidencias</b></div>'+(b.delivered?'<div class="card"><b>Entrega registrada</b><p>'+(b.comment||'Sin comentario')+'</p></div>':'');$('#btns').classList.toggle('hidden',b.delivered);$('#drawer').classList.remove('hidden');$('#back').classList.remove('hidden')}function closeDraw(){$('#drawer').classList.add('hidden');$('#history').classList.add('hidden');$('#back').classList.add('hidden')}function showHistory(rut){let h=historyFor(rut);$('#hq').value=rut;$('#hc').innerHTML=h.length?'<div class="card"><b>'+h.length+' usos · '+h.filter(x=>x.incident).length+' incidencias</b></div>'+h.slice().reverse().map(x=>'<div class="historyitem"><b>Sala '+x.room+' · '+x.date+' · '+x.start+'–'+x.end+'</b><small>'+(x.comment|| (x.delivered?'Entregada':'Reserva registrada'))+(x.incident?' · Incidencia':'')+'</small></div>').join(''):'<p>Sin registros para este RUT.</p>';$('#history').classList.remove('hidden');$('#back').classList.remove('hidden')}$('#prev').onclick=()=>{date.setDate(date.getDate()-7);render()};$('#next').onclick=()=>{date.setDate(date.getDate()+7);render()};$('#today').onclick=()=>{date=new Date();date.setHours(0,0,0,0);render()};$('#cx').onclick=$('#cancelm').onclick=closeForm;$('#save').onclick=save;$('#rut').onblur=checkRut;$('#cd').onclick=closeDraw;$('#back').onclick=closeDraw;$('#deliver').onclick=()=>{let b=bookings.find(x=>x.id==openId);let c=prompt('Comentario al entregar (opcional):','')||'';let inc=confirm('¿Registrar esta entrega como incidencia?');b.delivered=true;b.comment=c;b.incident=inc;persist();closeDraw();render()};$('#edit').onclick=()=>{let b=bookings.find(x=>x.id==openId);closeDraw();openForm(b.room,b.start,b)};$('#del').onclick=()=>{bookings=bookings.filter(x=>x.id!=openId);persist();closeDraw();render()};$('#hist').onclick=()=>showHistory('');$('#find').onclick=()=>showHistory($('#q').value);$('#hs').onclick=()=>showHistory($('#hq').value);$('#ch').onclick=closeDraw;render();</script></body></html>
